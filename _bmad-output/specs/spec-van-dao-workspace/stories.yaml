- id: "6"
  title: "Dạy: tóm lược mở đầu, giáo án, hỏi ngược, đối chất quan niệm cũ"
  description: >-
    Trình tóm lược/mô hình tổng quan chương (FR1a — 4C/ID Supportive
    Information, van Merriënboer & Kirschner 2018) trước khi hỏi ngược
    từng ý; giáo án ra file trước mỗi chương; hỏi ngược mỗi ý (không
    đáp câu trùng nghiệm công đang treo); đối chất quan niệm cũ trước
    nội dung trái ngược (thừa nhận bằng lời không tự coi là đã gỡ).
    Xem SPEC.md CAP-3.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Tóm lược dựa trên lớp giải nghĩa FR1 đã có, không để model tự bịa
    tại chỗ; đây là bước chuẩn bị nhận thức đứng trước, không thay thế
    hỏi ngược. Tóm lược là Loại 3 (AD-5) — dẫn xuất/cache từ FR1, KHÔNG
    phải nguồn lưu trữ chính; không tạo cơ chế đồng bộ riêng cho nó, vì
    story 16 (Epic 10, nhắc lại) sẽ tự tái sinh từ FR1 chứ không đọc
    cache của story này. Giáo án chỉ ghi SỰ KIỆN mỗi nước đi (AD-5 Loại
    2 — không ghi nội dung lời giảng; lưu lại là có hại, không chỉ
    thừa). FR2a (R5, đặc tả §7.0): khi một câu nghiệm công đang treo
    (chưa chấm xong ở story 8), Thư linh KHÔNG được đáp câu hỏi trùng
    câu đó — hỏi ngược lại; giảng lại (nếu cần) bằng ví dụ KHÁC, không
    dùng đúng ca đang được nghiệm công; ghi nhật ký các câu đã né.
    FR3a (R18, đặc tả §5.12): Thư linh KHÔNG tự tuyên bố tâm ma đã
    gỡ — thừa nhận bằng lời chỉ đưa `chua_go`→`dang_go`; chuyển sang
    `da_go` đòi bằng chứng trong bài (nghiệm công/khảo thí, làm khác
    đi thật); dấu hiệu cũ quay lại sau `da_go` thì sang `tai_phat`
    (trạng thái RIÊNG, không gộp về `chua_go` — người học từng vượt
    qua được, câu nói khác với người mới). Người học bảo cách cũ vẫn
    đúng trong hoàn cảnh họ thì đóng nhánh, không ép (không gác cổng).

