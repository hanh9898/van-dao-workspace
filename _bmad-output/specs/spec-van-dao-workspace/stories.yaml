- id: "1"
  title: Thiết lập ban đầu — ngôn ngữ giao tiếp
  description: >-
    Khi plugin bật lần đầu, giúp người học chọn ngôn ngữ giao tiếp qua
    userConfig (.claude-plugin/plugin.json); nếu chưa đặt, bước mở đầu
    tự kiểm và hướng dẫn /plugin configure — phiên sau nạp lại, không
    hỏi lại. Xem SPEC.md CAP-16.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    userConfig ĐÃ verify chạy thật 2026-08-26 (NFR8): field
    communication_language thêm vào van-dao/.claude-plugin/plugin.json
    (type=string, default=Vietnamese, có title bắt buộc — claude
    plugin validate --strict từng FAIL vì thiếu title, tài liệu gốc
    không nhắc field này); claude plugin install --config lưu đúng
    vào ~/.claude/settings.json pluginConfigs["van-dao@van-dao"].options.
    QUAN TRỌNG — claim đã sửa sau tự kiểm: cài qua CLI KHÔNG kèm
    --config thì Claude Code KHÔNG tự chặn/hỏi — chỉ in cảnh báo "1
    userConfig option not yet set" và cài xong với field trống. KHÔNG
    được giả định Claude Code tự động hỏi khi bật plugin — nhap-mon
    (hoặc bước mở đầu) phải tự đọc field này, và nếu trống thì chủ
    động hướng dẫn người dùng chạy /plugin configure van-dao@van-dao.
    Đường cài tương tác thật (người dùng, không qua CLI headless) vẫn
    chưa verify được — có thể hành vi khác, cần kiểm khi có TTY thật.

- id: "2"
  title: Bái sư — đặt tên môn phái, khai vai/mạch, đặt tên 4 vai
  description: >-
    Đặt tên môn phái, ghi nhập môn ký, khai vai + mạch (hỏi VAI trước
    nếu chưa biết muốn luyện gì, suy mạch từ vai kèm cờ nguồn gợi ý),
    đặt tên riêng cho 4 vai nói-với-người-học (gợi ý sẵn, tự nhập
    được), kích hoạt nghi thức bái sư khi có việc thật đứng sau. Xem
    SPEC.md CAP-8 (phần bái sư), CAP-16, đặc tả §10.0.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Nhánh "chưa biết muốn luyện gì" hỏi VAI trước ("ngươi làm nghề
    gì") — KHÔNG hỏi mạch trước, vì mạch là khái niệm của hệ, người
    mới không trả lời được (đặc tả §10.0). "Ghi nhập môn ký" dùng
    chung cơ chế tự-ghi/disable-model-invocation với đạo tâm (story 9)
    — dựng song song cùng bước 7 §16, theo R32/FR22 KHÔNG được tự ghi
    hộ. Cơ chế dùng chung nhưng CĂN CỨ khác: nhập môn ký đứng trên
    Cialdini Commitment & Consistency (1984/2006), không phải Pierce
    et al. 2003 của FR22 — đừng copy nguyên văn lý do của story 9.
    Đặt tên 4 vai (FR35): chỉ 4 vai nói-với-người-học (Trưởng môn,
    Tàng kinh trưởng lão, Thư linh, Giám khảo — đặc tả §3 bảng "Nói
    với người học"), không đặt tên 4 vai âm thầm còn lại; gợi ý vài
    tên kèm tự nhập, không ép chọn danh sách (khuôn agents.* của
    BMAD). Đột phá cảnh giới (nghi thức thứ ba của FR23) hoãn tới
    story 18 (CAP-6) — nếu người học hỏi ở MVP, trả lời rõ "chưa hỗ
    trợ ở bản này".

- id: "3"
  title: Chỉ điểm — Trưởng môn gọi tên sách
  description: >-
    Sau khi khai vai/mạch, Trưởng môn chỉ điểm — gọi tên sách cụ thể
    cho người học tự đi tìm, không chọn mạch hộ; mắt xích duy nhất
    khởi động hệ khi tàng kinh các còn rỗng. Xem SPEC.md CAP-17, đặc
    tả §10.0-10.3.
  spec_checkpoint: true
  done_checkpoint: false
  invoke_dev_with: >-
    Luật chống bịa: mỗi chỉ điểm đủ 5 trường (tên/tác giả/năm-ấn
    bản/công pháp-tâm pháp/vì sao) — ba dữ kiện đầu cụ thể khó bịa
    hơn một cái tên trần; không chắc thì nói không chắc (đặc tả
    §10.2). Ghi vào truong-mon/chi-diem.jsonl, 5 trạng thái: dang_treo
    (còn hiệu lực, nhắc 1 câu phiên sau) / het_hieu_luc (bị thay) /
    da_thu (đã vào kho) / ban_hong (kiếm thấy sách nhưng bản này
    không rút được chữ — GIỮ trong chỉ điểm, khuyên tìm bản khác,
    KHÁC khong_thay ở chỗ quyết định) / khong_thay (kiếm không ra,
    ghi truong-mon/chi-diem-hong.jsonl, chỉ quyển khác). Chỉ điểm mới
    thay HẲN chỉ điểm cũ (không cộng dồn) nhưng vẫn tra lại được nếu
    người học hỏi tên cũ. Số chỉ điểm mặc định 3 công pháp + 2 tâm
    pháp (đã biết muốn luyện gì) / 1+1 (chưa biết) — chỉnh qua
    so_chi_diem trong customize.toml. Công pháp luôn kèm gợi ý tâm
    pháp đỡ trần; mức chắc chắn (kèm số liệu thật / kèm nguồn khai
    báo / chỉ suy đoán — bảng quyết định §10.3) PHẢI nói trước khi
    đưa danh sách, không phải sau — dòng suy đoán là ca MẶC ĐỊNH ở
    n=1 (kho rỗng nhiều tháng đầu), không phải ca dự phòng hiếm gặp.

- id: "4"
  title: Thu bí kíp
  description: >-
    Giải nghĩa PDF/EPUB thành lớp sư phạm dạy được khi người học mang
    sách tìm được từ chỉ điểm về; tự đánh dấu đoạn tin cậy thấp
    (bảng/công thức/code dày đặc); xử lý các kết quả tìm sách; người
    dùng bắt buộc sửa-duyệt pha 2 trước khi sinh cấp chương; dừng
    ngay khi không rút được chữ; bí kíp có hai mức hợp lệ (đủ dùng/đủ
    chuẩn); kích hoạt nghi thức thu bí kíp khi bí kíp vào kho. Xem
    SPEC.md CAP-1, CAP-8 (phần thu bí kíp).
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: >-
    Dùng book-to-skill (virgiliojr94) đã verify chạy thật — không tự
    viết lại engine phân giải. Tham khảo companion đặc tả §6 cho 3
    pha (giám định / trích xuất / thiết kế sư phạm). Xử lý nhánh kết
    quả thỉnh sách (đặc tả §10.0 flow): "kiếm được" → chạy story này;
    "không thấy SÁCH" → ghi chi-diem-hong.jsonl, quay lại story 3 chỉ
    điểm quyển khác; "bản hỏng" (thấy sách, bản không rút được chữ)
    → GIỮ nguyên trong chỉ điểm, khuyên tìm bản khác, KHÔNG gạch khỏi
    chỉ điểm; "chưa đụng tới" → nhắc một câu phiên sau, không nài.
    Nghi thức thu bí kíp kích hoạt khi bí kíp vào kho (chi-diem:
    da_thu) — cùng cơ chế disable-model-invocation với story 2 (bái
    sư)/story 9 (đạo tâm), khác thời điểm kích hoạt. FR37: pha 2
    (thiết kế sư phạm) máy CHỈ ĐỀ XUẤT kèm lý do — không tự quyết
    xương sống/tiêu chí đạt/điểm hạ sơn; bắt buộc dừng chờ người dùng
    sửa-và-duyệt trước khi sinh cấp chương (đặc tả §6.2, sơ đồ). FR38:
    không rút được chữ (ExtractionError) → dừng ngay, báo "tìm bản
    khác", KHÔNG OCR, KHÔNG tạo bí kíp rỗng (đặc tả §6.1/§6.2). FR39:
    hai mức hợp lệ — đủ dùng (mục tiêu/giả định nền/tiêu chí đạt
    thô/≥1 câu vận dụng, vào kho ngay) và đủ chuẩn (thêm tiêu chí chi
    tiết/sai lầm phổ biến/worked example, bồi SAU KHI học chương đó,
    không theo lịch); Thư linh dạy ở mức đủ dùng phải nói rõ đang
    chấm theo mục tiêu, chưa có tiêu chí chi tiết (đặc tả §6.5). Ở
    n=1, người học luôn dùng bản chưa bồi — hạn chế cấu trúc, không
    phải thiếu sót cài đặt.

